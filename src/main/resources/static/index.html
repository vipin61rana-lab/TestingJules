<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartClaims360</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="container">
        <h1>SmartClaims360</h1>

        <h2>Create a New Claim</h2>
        <form id="create-claim-form">
            <div class="form-group">
                <label for="claimantName">Claimant Name:</label>
                <input type="text" id="claimantName" name="claimantName" required>
            </div>
            <div class="form-group">
                <label for="claimAmount">Claim Amount:</label>
                <input type="number" id="claimAmount" name="claimAmount" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="claimType">Claim Type:</label>
                <input type="text" id="claimType" name="claimType" required>
            </div>
            <button type="submit">Create Claim</button>
        </form>

        <h2>All Claims</h2>
        <div class="form-group">
            <label for="search-input">Search Claims:</label>
            <input type="text" id="search-input" placeholder="Search by name, type, etc...">
        </div>
        <table id="claims-table">
            <thead>
                <tr>
                    <th><input type="checkbox" id="select-all-checkbox"></th>
                    <th>ID</th>
                    <th>Claimant Name</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody>
                <!-- Claims will be inserted here by JavaScript -->
            </tbody>
        </table>
        <button id="delete-selected-btn">Delete Selected</button>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
