<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - User Management</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Admin - User Management</h1>
        <a href="/index.html">Back to Claims</a>

        <h2>Create a New User</h2>
        <form id="create-user-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="roles">Roles (comma-separated):</label>
                <input type="text" id="roles" name="roles" value="ROLE_USER" required>
            </div>
            <button type="submit">Create User</button>
        </form>

        <h2>All Users</h2>
        <table id="users-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Roles</th>
                </tr>
            </thead>
            <tbody>
                <!-- Users will be inserted here by JavaScript -->
            </tbody>
        </table>
        <button id="logout-btn" style="float: right;">Logout</button>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
